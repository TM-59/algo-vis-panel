# Dependabot 標準配置(2026-09-07 TM-59 全リポジトリ規約。実在するマニフェストのみ)
# 方針: 非アクティブ repo = monthly / minor+patch はエコシステム毎に 1 グループ / major は個別 PR / open PR 上限 3
# マージは tm dependabot merge <repo>(= merge-dependabot.sh。直列・rebase 待機・green 確認)のみ。手動マージ禁止。
version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
